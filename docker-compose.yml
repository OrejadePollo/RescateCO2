services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: rescate_co2
      POSTGRES_USER: admin_co2
      POSTGRES_PASSWORD: local_password
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_co2 -d rescate_co2"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py makemigrations rescate_app &&
             python manage.py migrate &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --reload"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data: