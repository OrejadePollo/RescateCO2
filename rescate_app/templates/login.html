<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Rescate CO₂e</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-950 via-emerald-900 to-teal-900 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden border border-emerald-100">
        <div class="bg-emerald-800 px-8 py-7 text-center text-white">
            <div class="w-16 h-16 bg-emerald-700/80 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner border border-emerald-500/40 text-3xl">
                🌱
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Rescate de Alimentos</h1>
            <p class="text-emerald-200 text-sm mt-1">Plataforma de Medición, Reporte y Verificación (MRV)</p>
        </div>

        <div class="p-8">
            {% if error %}
            <div class="mb-5 p-3.5 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm font-medium">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Usuario</label>
                    <input type="text" id="username" name="username" required placeholder="Ej. admin o donante"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none transition text-slate-800">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none transition text-slate-800">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Rol en la plataforma</label>
                    <select id="rol" name="rol" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none transition bg-white text-slate-800">
                        <option value="Capturista">Capturista (Banco de Alimentos)</option>
                        <option value="Administrador">Administrador / Auditor MRV</option>
                        <option value="Empresa Donante">Empresa Donante (Simulador y Constancias)</option>
                    </select>
                </div>

                <button type="submit" class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold rounded-xl shadow-lg shadow-emerald-700/25 transition cursor-pointer mt-2">
                    Iniciar sesión
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-100">
                <p class="text-xs text-slate-500 font-medium mb-2.5 text-center">Autocompletar acceso rápido para demostración:</p>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="llenarDemo('admin', 'rescate2026', 'Capturista')"
                            class="text-xs py-2 px-3 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-800 text-slate-700 rounded-lg font-medium transition border border-slate-200 cursor-pointer">
                        👤 Personal del Banco
                    </button>
                    <button type="button" onclick="llenarDemo('donante', 'donante2026', 'Empresa Donante')"
                            class="text-xs py-2 px-3 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-800 text-slate-700 rounded-lg font-medium transition border border-slate-200 cursor-pointer">
                        🏢 Empresa Donante
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function llenarDemo(user, pass, rol) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            document.getElementById('rol').value = rol;
        }
    </script>
</body>
</html>
